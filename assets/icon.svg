    <path d="M70.44 60.44 A22 22 0 0 1 101.56 60.44"/>
    <path d="M76.1 66.1 A14 14 0 0 1 95.9 66.1"/>
  </g>
  <circle cx="86" cy="75" r="3.5" fill="#ffffff" fill-opacity="0.75"/>

