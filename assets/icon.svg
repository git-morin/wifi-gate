  <path d="M34 61.5 V57 a5 5 0 0 1 10 0 V61.5" fill="none" stroke="#1e3a8a" stroke-width="3.5"/>
  <rect x="30" y="61" width="18" height="15" rx="3.5" fill="#1e3a8a"/>
  <circle cx="39" cy="67" r="2" fill="#fbbf24"/>
  <rect x="38" y="67.5" width="2" height="4.5" rx="1" fill="#fbbf24"/>
